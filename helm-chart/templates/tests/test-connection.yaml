apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "supertokens.fullname" . }}-test-connection"
  labels:
    {{- include "supertokens.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      # Use -q (quiet) and --spider (don't download) to avoid writing files to disk,
      # since the container runs with readOnlyRootFilesystem: true
      args: ['-q', '--spider', '{{ include "supertokens.fullname" . }}:{{ .Values.service.port }}/hello']
      securityContext:
        readOnlyRootFilesystem: true
  restartPolicy: Never
